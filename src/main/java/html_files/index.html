<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        iframe {
            border: none;
        }

        .left-panel {
            width: 22%;
            border-right: 2px solid #dcdcdc;
            background-color: #f8f9fa;
        }

        .center-panel {
            width: 53%;
            border-right: 2px solid #dcdcdc;
        }

        .right-panel {
            width: 25%;
        }
    </style>
</head>
<body>

<div class="container">

    <iframe
            class="left-panel"
            src="form.html"
            name="formFrame">
    </iframe>

    <iframe
            class="center-panel"
            src="temp.html"
            name="graphFrame">
    </iframe>

    <iframe
            class="right-panel"
            src="temp.html"
            name="tableFrame">
    </iframe>

</div>
</body>
</html>
