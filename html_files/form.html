<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .secondary {
            background-color: #28a745;
        }

        .secondary:hover {
            background-color: #1f7d34;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Deploy Configuration</h2>

    <form id="deployForm" action="http://localhost:8080/upload" method="post"
          enctype="multipart/form-data" target="graphFrame"
          onsubmit="return validateConfFile()">
        <input type="file" id="configFile" name="file" accept=".conf" required>
        <button type="submit">deploy</button>
    </form>
</div>

<script>
    function validateConfFile() {
        const fileInput = document.getElementById('configFile');
        if (!fileInput.files.length) return false;
        const fileName = fileInput.files[0].name;
        if (!fileName.endsWith('.conf')) {
            alert('Invalid file type. Please select a .conf file.');
            return false;
        }
        return true;
    }
</script>

<div class="card">
    <h2>Publish To Topic</h2>

    <form action="http://localhost:8080/publish" method="get" target="tableFrame">
        <label>
            <input type="text" name="topic" placeholder="Topic name" required>
        </label>
        <label>
            <input type="text" name="message" placeholder="Message value" required>
        </label>
        <button class="secondary" type="submit">
            Publish
        </button>
    </form>
</div>

</body>
</html>
