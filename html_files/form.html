<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card label {
            display: block;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .secondary {
            background-color: #28a745;
        }

        .secondary:hover {
            background-color: #1f7d34;
        }

        .danger {
            background-color: #dc3545;
        }

        .danger:hover {
            background-color: #b02a37;
        }

        .button-row {
            display: flex;
            gap: 10px;
        }

        .button-row button {
            margin-top: 10px;
        }

        .hint {
            font-size: 12px;
            color: #6c757d;
            line-height: 1.5;
            margin-top: 10px;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Deploy Configuration</h2>

    <form id="deployForm" onsubmit="return deployConfig(event)">
        <input type="file" id="configFile" name="file" accept=".conf" required>
        <button type="submit">deploy</button>
    </form>
</div>

<script>
    function deployConfig(e) {
        e.preventDefault();
        const fileInput = document.getElementById('configFile');
        if (!fileInput.files.length) return false;
        if (!fileInput.files[0].name.endsWith('.conf')) {
            notify('Invalid file type. Please select a .conf file.', 'error');
            return false;
        }

        fetch('/upload', {method: 'POST', body: new FormData(e.target)})
            // grab status and body together so we can branch on the status code
            .then(res => res.text().then(body => ({ok: res.ok, body})))
            .then(({ok, body}) => {
                if (ok) {
                    refreshTable();
                } else {
                    showUploadError(body);
                }
            })
            .catch(() => notify('Deploy failed — is the server running?', 'error'));

        return false;
    }

    // Refresh ONLY the topic-values table, without touching the graph frame.
    function refreshTable() {
        const top = window.parent;
        if (top && top.frames['tableFrame']) {
            top.frames['tableFrame'].location.href = '/publish?t=' + Date.now();
        }
    }

    // Paint the server's error page into the center frame for 3s, then reload /graph.
    function showUploadError(html) {
        const top = window.parent;
        const graphEl = top && top.document.querySelector('iframe[name="graphFrame"]');
        if (!graphEl) return;

        graphEl.srcdoc = html;

        setTimeout(() => {
            graphEl.src = '/graph?t=' + Date.now();
            graphEl.removeAttribute('srcdoc');
        }, 3000);
    }
</script>

<div class="card">
    <h2>Publish To Topic</h2>

    <form id="publishForm" onsubmit="return publishMessage(event)">
        <label>
            <input type="text" name="topic" placeholder="Topic name" required>
        </label>
        <label>
            <input type="text" name="message" placeholder="Message value" required>
        </label>
        <button class="secondary" type="submit">
            Publish
        </button>
    </form>
</div>

<div class="card">
    <h2>Graph Control</h2>
    <div class="button-row">
        <button type="button" onclick="resetGraph()">Reset</button>
        <button class="danger" type="button" onclick="deleteGraph()">Delete</button>
    </div>
    <p class="hint">
        <strong>Reset</strong> reloads the current configuration, clearing all topic values
        and agent state. <strong>Delete</strong> removes the configuration entirely and returns
        to the "no graph deployed" state.
    </p>
</div>

<script>
    function refreshFrames() {
        const top = window.parent;
        if (!top) return;
        const stamp = '?t=' + Date.now();
        if (top.frames['graphFrame']) top.frames['graphFrame'].location.href = '/graph' + stamp;
        if (top.frames['tableFrame']) top.frames['tableFrame'].location.href = '/publish' + stamp;
    }

    // Show a popup via the top-level dashboard toast; fall back to alert() if
    // this page is opened on its own (outside the index.html shell).
    function notify(message, severity) {
        const parent = window.parent;
        if (parent && typeof parent.showToast === 'function') {
            parent.showToast(message, severity);
        } else {
            alert(message);
        }
    }

    function publishMessage(e) {
        e.preventDefault();
        const params = new URLSearchParams(new FormData(e.target));
        fetch('/publish?' + params.toString())
            .then(res => {
                if (res.ok) {
                    refreshFrames();
                    return;
                }
                return res.json()
                    .catch(() => 'Topic does not exist')
                    .then(msg => notify(String(msg), 'error'));
            })
            .catch(() => notify('Publish failed — is the server running?', 'error'));
        return false;
    }

    function resetGraph() {
        fetch('/reset', {method: 'POST'}).catch(() => {
        }).finally(refreshFrames);
    }

    function deleteGraph() {
        if (!confirm('Remove the deployed configuration entirely? This cannot be undone.')) return;
        fetch('/delete', {method: 'DELETE'}).catch(() => {
        }).finally(refreshFrames);
    }
</script>

</body>
</html>
