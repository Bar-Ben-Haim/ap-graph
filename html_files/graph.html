<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph View</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        :root {
            --agent: #6366f1;
            --agent-border: #4338ca;
            --topic: #10b981;
            --topic-border: #059669;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 22px 22px;
        }

        #graph {
            width: 100%;
            height: 100vh;
        }

        #legend {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            font-size: 14px;
            color: #1e293b;
            user-select: none;
        }

        #legend h3 {
            margin: 0 0 10px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
        }

        .swatch {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
        }

        .swatch.agent {
            border-radius: 50%;
            background: var(--agent);
            border: 2px solid var(--agent-border);
        }

        .swatch.topic {
            border-radius: 5px;
            background: var(--topic);
            border: 2px solid var(--topic-border);
        }
    </style>
</head>
<body>

<div id="legend">
    <h3>Legend</h3>
    <div class="legend-item"><span class="swatch agent"></span> Agent</div>
    <div class="legend-item"><span class="swatch topic"></span> Topic</div>
</div>

<div id="graph"></div>

<script>

    const nodes = new vis.DataSet([
        //__NODES__
    ]);

    const edges = new vis.DataSet([
        //__EDGES__
    ]);

    const container = document.getElementById('graph');

    const data = {
        nodes: nodes,
        edges: edges
    };

    const nodeShadow = {
        enabled: true,
        color: 'rgba(15, 23, 42, 0.25)',
        size: 12,
        x: 0,
        y: 5
    };

    const options = {
        physics: {
            enabled: true,
            barnesHut: {
                springLength: 140,
                avoidOverlap: 0.4
            },
            stabilization: {
                iterations: 200
            }
        },

        nodes: {
            borderWidth: 2,
            font: {
                color: '#ffffff',
                size: 16,
                face: 'Segoe UI'
            },
            shadow: nodeShadow
        },

        groups: {
            agent: {
                shape: 'circle',
                color: {
                    background: '#6366f1',
                    border: '#4338ca',
                    highlight: { background: '#818cf8', border: '#4338ca' },
                    hover: { background: '#818cf8', border: '#4338ca' }
                }
            },
            topic: {
                shape: 'box',
                margin: 12,
                shapeProperties: { borderRadius: 8 },
                color: {
                    background: '#10b981',
                    border: '#059669',
                    highlight: { background: '#34d399', border: '#059669' },
                    hover: { background: '#34d399', border: '#059669' }
                }
            }
        },

        edges: {
            color: {
                color: '#94a3b8',
                highlight: '#6366f1',
                hover: '#6366f1'
            },
            width: 2,
            selectionWidth: 1,
            arrows: {
                to: {
                    enabled: true,
                    scaleFactor: 0.9
                }
            },
            smooth: {
                enabled: true,
                type: 'cubicBezier',
                roundness: 0.5
            }
        },

        interaction: {
            hover: true,
            tooltipDelay: 120
        }
    };

    new vis.Network(container, data, options);
</script>

</body>
</html>
