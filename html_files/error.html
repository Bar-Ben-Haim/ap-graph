<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f8f9fa;
            color: #343a40;
        }

        .error-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            padding: 40px 48px;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }

        .error-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        /* Styling is driven by severity, not by the specific error type. */
        .badge-info {
            background: #e9f0ff;
            color: #3b5bdb;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-error {
            background: #f8d7da;
            color: #842029;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
            line-height: 1;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-badge" id="error-badge"></div>
    <div class="error-icon" id="error-icon"></div>
    <h2 id="error-title">Error</h2>
    <p class="error-message" id="error-message">__ERROR_MESSAGE__</p>
</div>

<script>
    const type = "__ERROR_TYPE__";
    const severity = "__ERROR_SEVERITY__";

    const presentation = {
        info: {badgeClass: "badge-info", icon: "ℹ"},
        warning: {badgeClass: "badge-warning", icon: "⚠"},
        error: {badgeClass: "badge-error", icon: "✕"}
    };
    const p = presentation[severity] || presentation.error;

    const badge = document.getElementById("error-badge");
    badge.textContent = severity.toUpperCase();
    badge.classList.add(p.badgeClass);

    document.getElementById("error-icon").textContent = p.icon;

    // Derive a human title from the code: "CYCLES_DETECTED" -> "Cycles Detected".
    document.getElementById("error-title").textContent = type
        .toLowerCase()
        .split("_")
        .map(word => word ? word.charAt(0).toUpperCase() + word.slice(1) : word)
        .join(" ");
</script>
</body>
</html>
