<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .card {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .secondary {
            background-color: #28a745;
        }

        .secondary:hover {
            background-color: #1f7d34;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Deploy Configuration</h2>

        <form action="http://localhost:8080/upload" method="post" enctype="multipart/form-data" target="graphFrame">

            <input type="file" name="file" required>

            <button type="submit">
                deploy
            </button>
        </form>
    </div>

    <div class="card">
        <h2>Publish To Topic</h2>

        <form action="http://localhost:8080/publish" method="get" target="tableFrame">

            <input type="text" name="topic" placeholder="Topic name" required>

            <input type="text" name="message" placeholder="Message value" required>

            <button class="secondary" type="submit">
                Publish
            </button>
        </form>
    </div>

    <div class="card">
        <h2>Optional Remote Controls</h2>

        <form action="http://localhost:8080/start" method="get" target="tableFrame">

            <button type="submit">Start System</button>
        </form>

        <br>

        <form action="http://localhost:8080/stop" method="get" target="tableFrame">

            <button type="submit">Stop System</button>
        </form>
    </div>

</body>

</html>
